name: VendorQuery CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build Production Bundle
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db?schema=public"
      JWT_SECRET: "ci_cd_test_jwt_secret_key"
      GEMINI_API_KEY: "ci_cd_mock_gemini_key"
      PORT: 5000

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Root Dependencies
        run: npm install

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🗄️ Setup Test Database Schema
        run: npx prisma db push --accept-data-loss

      - name: 🌱 Seed Initial Test Data
        run: npx tsx prisma/seed.ts

      - name: 🧪 Run Automated Unit & Integration Tests
        run: npm test

      - name: 🏗️ Build Frontend (React Vite) & Backend (TypeScript)
        run: npm run build
